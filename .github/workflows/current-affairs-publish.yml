name: Current Affairs JSON Publish

on:
  schedule:
    # Runs at 5:00 AM UTC every day
    - cron: '0 5 * * *'
  
  # Allows you to test it manually from the GitHub Actions tab
  workflow_dispatch:

jobs:
  publish-current-affairs-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push changes back to your repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run publish script
        run: python update_daily.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add current_affairs.json
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-publish current_affairs.json at 5:00 AM"
            git push
            echo "✅ current_affairs.json updated and pushed!"
          fi
